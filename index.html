<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Meu Portfólio</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="menu.css">
  <link rel="stylesheet" href="menuTopo.css">
  <link rel="stylesheet" href="sobre.css">
  <link rel="stylesheet" href="experiencia.css">
  <link rel="stylesheet" href="projetos.css">
  <link rel="stylesheet" href="contato.css">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >
</head>

<body>

  <div id="menuTopo"></div>

  <div id="container-principal">

    <div id="menu"></div>

    <main id="conteudo"></main>

  </div>


  <!-- Scripts carregados somente uma vez -->
  <script src="experienciaScript.js?v=3"></script>
  <script src="projetos.js?v=3"></script>


  <script>
    function incluirArquivo(arquivo, idElemento) {
      return fetch(`${arquivo}?v=${Date.now()}`)
        .then(resposta => {
          if (!resposta.ok) {
            throw new Error(
              `Não foi possível carregar ${arquivo}`
            );
          }

          return resposta.text();
        })
        .then(html => {
          const elemento = document.getElementById(idElemento);

          if (!elemento) {
            throw new Error(
              `Elemento #${idElemento} não encontrado`
            );
          }

          elemento.innerHTML = html;
        })
        .catch(erro => {
          console.error(
            `Erro ao carregar ${arquivo}:`,
            erro
          );
        });
    }


    async function iniciarSite() {
      await incluirArquivo(
        "menuTopo.html",
        "menuTopo"
      );

      await incluirArquivo(
        "menu.html",
        "menu"
      );

      await carregarPagina(
        "sobre.html"
      );
    }


    async function carregarPagina(pagina) {
      try {
        const resposta = await fetch(
          `${pagina}?v=${Date.now()}`
        );

        if (!resposta.ok) {
          throw new Error(
            `Não foi possível carregar ${pagina}`
          );
        }

        const html = await resposta.text();

        const conteudo = document.getElementById(
          "conteudo"
        );

        conteudo.innerHTML = html;

        /*
         * Aguarda o HTML ser inserido antes de
         * inicializar os eventos.
         */
        requestAnimationFrame(() => {

          if (
            pagina === "experiencia.html" &&
            typeof inicializarExperiencia === "function"
          ) {
            inicializarExperiencia();
          }

          if (
            pagina === "projetos.html" &&
            typeof inicializarProjetos === "function"
          ) {
            inicializarProjetos();
          }

        });

      } catch (erro) {
        console.error(
          `Erro ao carregar ${pagina}:`,
          erro
        );

        document.getElementById("conteudo").innerHTML = `
          <section class="erro-pagina">
            <h2>Erro ao carregar a página</h2>
            <p>${erro.message}</p>
          </section>
        `;
      }
    }


    iniciarSite();
  </script>

</body>

</html>
